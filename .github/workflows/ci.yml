# Name of the workflow displayed in the GitHub Actions tab
name: Python CI Pipeline

# 1. TRIGGER: Define what GitHub events kick off this workflow
on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

# 2. JOBS: Group of tasks that run together in this workflow
jobs:
  test:
    # Specifies the clean virtual server environment provided by GitHub
    runs-on: ubuntu-latest

    # 3. STEPS: Sequential tasks executed one after another on the runner
    steps:
      # Action 1: Clones your repository code down onto the virtual server
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # Action 2: Downloads and configures Python on the virtual machine
      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Action 3: Upgrades pip and installs project dependencies from your file
      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Action 4: Executes pytest to run your test suite (fails job if assertions fail)
      - name: Run Pytest Suite
        run: python -m pytest